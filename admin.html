<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSVP List — Bob's 90th</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Same palette as the guest page, but this is a working view: denser type,
     smaller controls, everything visible without a click. */
  :root{
    --navy:#1B3A63; --navy-deep:#14294a; --gold:#B08D3F;
    --cream:#F7F1E1; --cream-2:#FBF7EC; --paper:#FFFDF7;
    --rule:rgba(27,58,99,.2); --muted:#6B7B92;
    --green:#1F6B3F; --green-bg:#E4F0E6; --red:#9B2C2C; --red-bg:#F5E4E4;
    --serif:'Cormorant Garamond', Georgia, serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--cream); color:var(--navy); font-family:var(--serif); font-size:16px; -webkit-font-smoothing:antialiased}
  /* Cormorant defaults to old-style figures, which drop "1" below the cap line so
     it reads as a capital I — fine in body copy, wrong for a headcount. Force
     lining, tabular figures anywhere a number is the content. */
  .stat .n, .num, .when-col, .seg, .when{font-variant-numeric:lining-nums tabular-nums; font-feature-settings:"lnum" 1,"tnum" 1}
  .wrap{max-width:960px; margin:0 auto; padding:26px 20px 70px}
  @media(max-width:560px){ .wrap{padding:18px 13px 50px} }

  .top{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:4px}
  h1{font-size:27px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; margin:0}
  .when{font-size:13.5px; color:var(--muted); font-style:italic; margin:2px 0 20px}

  .btn{font-family:var(--serif); font-size:13px; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
       color:var(--navy); background:var(--paper); border:1px solid var(--rule); border-radius:2px;
       padding:9px 15px; cursor:pointer; transition:border-color .14s, background .14s}
  .btn:hover{border-color:var(--gold); background:var(--cream-2)}
  .btn.solid{background:var(--navy); color:var(--cream); border-color:var(--navy)}
  .btn.solid:hover{background:var(--navy-deep); color:var(--cream)}
  .tools{display:flex; gap:8px; flex-wrap:wrap}

  /* ---- gate ---- */
  #gate{max-width:400px; margin:70px auto; background:var(--paper); border:1px solid var(--rule); padding:8px}
  #gate .in{border:1px solid var(--rule); padding:28px 26px}
  #gate h2{font-size:19px; font-weight:600; letter-spacing:.13em; text-transform:uppercase; margin:0 0 6px; text-align:center}
  #gate p{font-size:14.5px; color:var(--muted); font-style:italic; text-align:center; margin:0 0 18px}
  input[type=password], input[type=search]{
    width:100%; font-family:var(--serif); font-size:16px; color:var(--navy); background:var(--cream-2);
    border:1px solid var(--rule); border-radius:2px; padding:11px 13px; outline:none}
  input:focus{border-color:var(--gold); background:var(--paper); box-shadow:0 0 0 3px rgba(176,141,63,.15)}
  #gate .btn{width:100%; margin-top:12px; padding:12px}
  #gateErr{color:var(--red); font-size:14px; text-align:center; margin-top:10px; min-height:19px}

  /* ---- headline counts ---- */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px}
  @media(max-width:620px){ .stats{grid-template-columns:repeat(2,1fr)} }
  .stat{background:var(--paper); border:1px solid var(--rule); padding:15px 16px}
  .stat .n{font-size:31px; font-weight:600; line-height:1}
  .stat .l{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-top:5px}
  .stat.attend .n{color:var(--green)} .stat.declined .n{color:var(--red)}

  .bar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
  .bar input[type=search]{flex:1; min-width:180px}
  .seg{display:inline-flex; border:1px solid var(--rule); background:var(--paper)}
  .seg button{border:0; background:none; font-family:var(--serif); font-size:13px; font-weight:600;
              letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:9px 14px; cursor:pointer}
  .seg button + button{border-left:1px solid var(--rule)}
  .seg button.on{background:var(--navy); color:var(--cream)}

  /* ---- list ---- */
  table{width:100%; border-collapse:collapse; background:var(--paper); border:1px solid var(--rule)}
  th{font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); font-weight:600;
     text-align:left; padding:11px 14px; border-bottom:1px solid var(--rule); white-space:nowrap}
  td{padding:12px 14px; border-bottom:1px solid var(--rule); vertical-align:top; font-size:16px}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:var(--cream-2)}
  .nm{font-weight:600}
  .em{font-size:13.5px; color:var(--muted); word-break:break-all}
  .pill{display:inline-block; font-size:11.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
        padding:3px 10px; border-radius:999px; white-space:nowrap}
  .pill.yes{background:var(--green-bg); color:var(--green)}
  .pill.no{background:var(--red-bg); color:var(--red)}
  .num{text-align:center; font-weight:600}
  .bringing{font-size:14.5px; color:#3C4E66; max-width:230px; line-height:1.45}
  .note{font-size:14.5px; font-style:italic; color:#3C4E66; max-width:290px; line-height:1.45}
  .when-col{font-size:13px; color:var(--muted); white-space:nowrap}
  @media(max-width:760px){ .note, .when-col, th.note-h, th.when-h{display:none} }

  .phl{font-weight:600; color:var(--navy); text-decoration:none; border-bottom:1px solid var(--gold);
       font-variant-numeric:lining-nums}
  .phl:hover{color:var(--gold)}
  .folderline{font-size:14px; color:var(--muted); font-style:italic; margin:-8px 0 18px}
  .folderline:empty{display:none}
  .folderline a{color:var(--navy)}

  .acts{white-space:nowrap; text-align:right}
  .mini{font-family:var(--serif); font-size:11.5px; font-weight:600; letter-spacing:.1em;
        text-transform:uppercase; color:var(--navy); background:var(--paper);
        border:1px solid var(--rule); border-radius:2px; padding:6px 10px; cursor:pointer; margin-left:6px}
  .mini:hover{border-color:var(--gold)}
  .mini.del{color:var(--red)} .mini.del:hover{border-color:var(--red)}
  .mini.send{color:var(--green); border-color:rgba(31,107,63,.35)} .mini.send:hover{border-color:var(--green)}
  .declined{margin-top:3px; font-size:11.5px; color:var(--red); font-style:italic}

  /* ---- edit dialog ---- */
  .ov{position:fixed; inset:0; background:rgba(14,32,56,.55); display:none;
      align-items:flex-start; justify-content:center; z-index:60; padding:20px; overflow:auto}
  .ov.show{display:flex}
  .dlg{background:var(--paper); border:1px solid var(--rule); width:100%; max-width:520px;
       margin-top:6vh; padding:8px; box-shadow:0 24px 60px rgba(14,32,56,.3)}
  .dlg-in{border:1px solid var(--rule); padding:26px 26px 22px}
  .dlg h2{font-size:15px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; margin:0 0 18px}
  .dlg label{display:block; font-size:11px; letter-spacing:.18em; text-transform:uppercase;
             color:var(--muted); margin:14px 0 6px}
  .dlg input[type=text], .dlg select, .dlg textarea{
    width:100%; font-family:var(--serif); font-size:16px; color:var(--navy);
    background:var(--cream-2); border:1px solid var(--rule); border-radius:2px; padding:10px 12px; outline:none}
  .dlg textarea{min-height:86px; resize:vertical; line-height:1.5}
  .dlg input:focus, .dlg select:focus, .dlg textarea:focus{border-color:var(--gold)}
  .dlg-btns{display:flex; gap:9px; margin-top:20px}
  .dlg-btns .btn{flex:1; padding:11px}
  .dlg-err{color:var(--red); font-size:13.5px; margin-top:10px; min-height:18px}

  .bigtabs{display:flex; gap:0; margin-bottom:22px; border-bottom:2px solid var(--rule)}
  .bigtab{font-family:var(--serif); font-size:14px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
          color:var(--muted); background:none; border:0; border-bottom:3px solid transparent;
          padding:12px 22px; cursor:pointer; margin-bottom:-2px}
  .bigtab.on{color:var(--navy); border-bottom-color:var(--gold)}
  .bigtab span{color:var(--gold); margin-left:6px; font-variant-numeric:lining-nums}

  /* ---- invitations ---- */
  .invites{margin-top:8px; padding-top:0; border-top:0}
  .inv-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px}
  .inv-head h2{font-size:15px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; margin:0}
  .inv-stats{font-size:14px; color:var(--muted); font-style:italic}
  .inv-stats b{color:var(--navy); font-style:normal; font-weight:600}
  .inv-add{background:var(--paper); border:1px solid var(--rule); padding:18px 20px; margin-bottom:18px}
  .inv-add label{display:block; font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .inv-add label em{text-transform:none; letter-spacing:0}
  .inv-add textarea{width:100%; font-family:var(--serif); font-size:15px; color:var(--navy);
    background:var(--cream-2); border:1px solid var(--rule); border-radius:2px; padding:10px 12px; outline:none; resize:vertical}
  .inv-add textarea:focus{border-color:var(--gold)}
  .inv-btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
  .inv-msg{font-size:15px; margin-top:12px; min-height:20px; font-style:italic; color:var(--muted)}
  .inv-msg.ok{font-size:15.5px}
  tr.justadded td{background:#F3EBD3 !important; transition:background 1.2s ease}
  .inv-msg.err{color:var(--red); font-style:normal}
  .inv-msg.ok{color:var(--green); font-style:normal}
  .stage{display:inline-block; font-size:11px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
         padding:3px 9px; border-radius:999px; white-space:nowrap}
  .stage.none{background:var(--cream-2); color:var(--muted)}
  .stage.sent{background:#EAF0F8; color:#31517C}
  .stage.open{background:#FBF0DA; color:#8A6A1F}
  .stage.done{background:var(--green-bg); color:var(--green)}
  .lnk{font-size:12px; color:var(--muted); word-break:break-all}

  .empty{text-align:center; padding:44px 20px; color:var(--muted); font-style:italic; background:var(--paper); border:1px solid var(--rule)}
  .err{background:var(--red-bg); color:var(--red); border:1px solid #E0BDBD; padding:13px 16px; margin-bottom:16px; font-size:15px}
  .err:empty{display:none}
</style>
</head>
<body>

<!-- Not security — the Apps Script key is what actually guards the data. This
     just keeps the list from being readable by anyone who guesses /admin. -->
<div id="gate"><div class="in">
  <h2>RSVP List</h2>
  <p>Enter the admin key</p>
  <input type="password" id="key" placeholder="Admin key" autocomplete="current-password">
  <button class="btn solid" onclick="unlock()">View Replies</button>
  <div id="gateErr"></div>
</div></div>

<div class="wrap" id="app" style="display:none">
  <div class="top">
    <div>
      <h1>Bob's 90th &middot; Replies</h1>
      <div class="when" id="lastSync">Loading&hellip;</div>
    </div>
    <div class="tools">
      <button class="btn" onclick="load()">Refresh</button>
      <button class="btn" onclick="exportCsv()">Export CSV</button>
      <button class="btn" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="err" id="err"></div>

  <div class="bigtabs">
    <button class="bigtab on" id="btReplies" onclick="showTab('replies')">Replies <span id="btRN"></span></button>
    <button class="bigtab" id="btInvites" onclick="showTab('invites')">Invited &middot; awaiting reply <span id="btIN"></span></button>
  </div>

  <div id="tabReplies">

  <div class="stats">
    <div class="stat attend"><div class="n" id="sAttending">&mdash;</div><div class="l">Guests attending</div></div>
    <div class="stat"><div class="n" id="sYes">&mdash;</div><div class="l">Accepted</div></div>
    <div class="stat declined"><div class="n" id="sNo">&mdash;</div><div class="l">Declined</div></div>
    <div class="stat"><div class="n" id="sPhotos">&mdash;</div><div class="l">Photos sent in</div></div>
  </div>
  <div class="folderline" id="folderline"></div>

  <div class="bar">
    <div class="seg" id="seg">
      <button class="on" data-f="all"  onclick="setFilter('all',this)">All</button>
      <button          data-f="yes"  onclick="setFilter('yes',this)">Attending</button>
      <button          data-f="no"   onclick="setFilter('no',this)">Declined</button>
    </div>
    <input type="search" id="q" placeholder="Search by name&hellip;" oninput="render()">
  </div>

  <div id="list"></div>

  </div>

  <div id="tabInvites" hidden>
  <section class="invites">
    <div class="inv-head">
      <h2>Invitations</h2>
      <div class="inv-stats" id="invStats"></div>
    </div>

    <div class="inv-add">
      <label for="invPaste">Add people &mdash; one invitation per line, <em>Name(s), email@example.com</em>.
        Join couples with &amp; and both names get saved.</label>
      <textarea id="invPaste" rows="5" placeholder="Margaret Ellsworth, margaret@example.com&#10;Tom Brady &amp; Elaine Brady, tbrady@example.com&#10;James Whitfield, jwhitfield@example.com"></textarea>
      <div class="inv-btns">
        <label class="btn" for="csvFile" style="cursor:pointer">Import a CSV&hellip;</label>
        <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" style="position:absolute;width:1px;height:1px;opacity:0">
        <button class="btn" onclick="addInvites()">Add to list</button>
        <button class="btn solid" onclick="sendInvites('unsent')">Send to everyone not yet emailed</button>
        <button class="btn" onclick="sendInvites('noreply')">Remind those who haven't replied</button>
      </div>
      <div class="inv-msg" id="invMsg"></div>
    </div>

    <div class="seg" id="invSeg" style="margin-bottom:14px">
      <button class="on" data-if="all" onclick="setInvFilter('all',this)">All</button>
      <button data-if="noreply" onclick="setInvFilter('noreply',this)">No response</button>
      <button data-if="opened" onclick="setInvFilter('opened',this)">Opened, no reply</button>
      <button data-if="unsent" onclick="setInvFilter('unsent',this)">Not emailed</button>
      <button data-if="replied" onclick="setInvFilter('replied',this)">Replied</button>
    </div>
    <div id="invList"></div>
  </section>
  </div>

</div>


<div class="ov" id="editOv"><div class="dlg"><div class="dlg-in">
  <h2>Edit reply</h2>
  <label for="eName">Name</label>
  <input type="text" id="eName">
  <label for="eAttending">Attending</label>
  <select id="eAttending">
    <option value="yes">Attending</option>
    <option value="no">Declined</option>
  </select>
  <label for="eGuests">Party size</label>
  <select id="eGuests">
    <option>1</option><option>2</option><option>3</option>
    <option>4</option><option>5</option><option>6</option>
  </select>
  <label for="eGuestNames">Bringing <span style="text-transform:none;letter-spacing:0;font-style:italic">(comma separated)</span></label>
  <input type="text" id="eGuestNames">
  <label for="eNotComing">Not coming <span style="text-transform:none;letter-spacing:0;font-style:italic">(comma separated)</span></label>
  <input type="text" id="eNotComing">
  <label for="eToast">Notes</label>
  <textarea id="eToast"></textarea>
  <div class="dlg-err" id="eErr"></div>
  <div class="dlg-btns">
    <button class="btn" onclick="closeEdit()">Cancel</button>
    <button class="btn solid" id="eSave" onclick="saveEdit()">Save changes</button>
  </div>
</div></div></div>

<script>
/* Same endpoint as the guest page — paste the Apps Script /exec URL here too. */
var ENDPOINT = "https://script.google.com/macros/s/AKfycbz4FEM0omBV4WxlUk5BA9dEyDniZDK3D90-NlOFR8dsDdj9tIlswxuGzPogNaWChYClxg/exec";

var ROWS = [], FILTER = 'all', KEY = '', FOLDER_URL = '';

/* The key lives in sessionStorage, not localStorage: closing the tab signs you
   out, which is the right default for a page that lists other people's emails. */
(function(){
  var saved = sessionStorage.getItem('bob90key');
  if(saved){ KEY = saved; openApp(); }
})();

function unlock(){
  var k = document.getElementById('key').value.trim();
  if(!k){ document.getElementById('gateErr').textContent = 'Enter the key.'; return; }
  KEY = k; sessionStorage.setItem('bob90key', k); openApp();
}
document.getElementById('key').addEventListener('keydown', function(e){ if(e.key === 'Enter') unlock(); });

function openApp(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = '';
  load();
}
function signOut(){ sessionStorage.removeItem('bob90key'); location.reload(); }

async function load(){
  var err = document.getElementById('err'); err.textContent = '';
  document.getElementById('lastSync').textContent = 'Loading…';
  try{
    if(ENDPOINT.indexOf('PASTE_') === 0) throw new Error('This page is not connected yet — see SETUP.md.');
    var r = await fetch(ENDPOINT + '?key=' + encodeURIComponent(KEY));
    var d = await r.json();
    if(d.error){
      if(/key/i.test(d.error)){ sessionStorage.removeItem('bob90key'); }
      throw new Error(d.error);
    }
    ROWS = d.rows || [];
    FOLDER_URL = d.folderUrl || '';
    INVITES = d.invites || [];
    SITE = d.siteUrl || 'https://bobs90th.com/';
    document.getElementById('lastSync').textContent =
      'Updated ' + new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}) +
      ' · ' + ROWS.length + ' repl' + (ROWS.length === 1 ? 'y' : 'ies');
    stats(); render(); renderInvites(); tabCounts();
  }catch(e){
    err.textContent = e.message || 'Could not load the replies.';
    document.getElementById('lastSync').textContent = 'Not loaded';
  }
}

/* "Guests attending" is the number the country club needs — the sum of party
   sizes, not the number of replies. Those are different and it matters. */
function stats(){
  var yes = ROWS.filter(function(r){ return r.attending === 'yes'; });
  var heads = yes.reduce(function(n,r){ return n + (parseInt(r.guests,10) || 1); }, 0);
  var named = yes.reduce(function(n,r){
    var extra = String(r.guestNames || '').split(',').filter(function(x){ return x.trim(); }).length;
    return n + 1 + extra;
  }, 0);
  var pics  = ROWS.reduce(function(n,r){ return n + (parseInt(r.photos,10) || 0); }, 0);
  document.getElementById('sAttending').textContent = heads;
  document.getElementById('sYes').textContent = yes.length;
  document.getElementById('sNo').textContent = ROWS.length - yes.length;
  document.getElementById('sPhotos').textContent = pics;

  var fl = document.getElementById('folderline');
  fl.innerHTML = FOLDER_URL
    ? 'All guest photos live in <a href="' + esc(FOLDER_URL) + '" target="_blank" rel="noopener">this Drive folder</a>, named for whoever sent them.'
    : '';
}

function setFilter(f, btn){
  FILTER = f;
  document.querySelectorAll('#seg button').forEach(function(b){ b.classList.toggle('on', b === btn); });
  render();
}

function visible(){
  var q = (document.getElementById('q').value || '').toLowerCase().trim();
  return ROWS.filter(function(r){
    if(FILTER === 'yes'  && r.attending !== 'yes') return false;
    if(FILTER === 'no'   && r.attending !== 'no')  return false;
    if(q && String(r.name || '').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function render(){
  var rows = visible(), el = document.getElementById('list');
  if(!rows.length){
    el.innerHTML = '<div class="empty">' +
      (ROWS.length ? 'No replies match that filter.' : 'No replies yet. They will appear here as guests respond.') +
      '</div>';
    return;
  }
  el.innerHTML =
    '<table><thead><tr>' +
      '<th>Guest</th><th>Reply</th><th style="text-align:center">Party</th>' +
      '<th>Coming</th><th style="text-align:center">Photos</th>' +
      '<th class="note-h">Notes</th><th class="when-h">Received</th><th></th>' +
    '</tr></thead><tbody>' +
    rows.map(function(r){
      var yes = r.attending === 'yes';
      var n = parseInt(r.photos, 10) || 0;
      var key = encodeURIComponent(r.name);
      return '<tr>' +
        '<td><div class="nm">' + esc(r.name) + '</div></td>' +
        '<td><span class="pill ' + (yes ? 'yes' : 'no') + '">' + (yes ? 'Attending' : 'Declined') + '</span></td>' +
        '<td class="num">' + (yes ? esc(r.guests || '1') : '—') + '</td>' +
        '<td class="bringing">' +
          (r.guestNames ? esc(r.guestNames) : '<span style="color:#A9B3C1">—</span>') +
          (r.notComing ? '<div class="declined">can’t: ' + esc(r.notComing) + '</div>' : '') +
        '</td>' +
        '<td class="num">' + (n ? n : '<span style="color:#A9B3C1">—</span>') + '</td>' +
        '<td class="note">' + (r.toast ? esc(r.toast) : '<span style="color:#A9B3C1">—</span>') + '</td>' +
        '<td class="when-col">' + esc(fmt(r.timestamp)) + '</td>' +
        '<td class="acts">' +
          '<button class="mini" data-act="edit" data-n="' + key + '">Edit</button>' +
          '<button class="mini del" data-act="del" data-n="' + key + '">Delete</button>' +
        '</td>' +
      '</tr>';
    }).join('') +
    '</tbody></table>';
}

function fmt(ts){
  if(!ts) return '';
  var d = new Date(ts);
  return isNaN(d) ? String(ts) : d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) +
    ', ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}

/* Export what you are LOOKING at, not the whole table — if you filtered to
   attending guests, that is the list you want to hand the country club. */
function exportCsv(){
  var rows = visible();
  if(!rows.length){ alert('Nothing to export.'); return; }
  var head = ['Name','Attending','Party size','Coming','Not coming','Photos','Notes','Received'];
  var body = rows.map(function(r){
    return [r.name, r.attending === 'yes' ? 'Yes' : 'No',
            r.attending === 'yes' ? (r.guests || '1') : '0',
            r.guestNames || '', r.notComing || '', parseInt(r.photos, 10) || 0, r.toast || '', fmt(r.timestamp)];
  });
  var csv = [head].concat(body).map(function(cols){
    return cols.map(function(c){ return '"' + String(c == null ? '' : c).replace(/"/g,'""') + '"'; }).join(',');
  }).join('\r\n');

  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'bobs-90th-rsvps.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}


/* ---------------------------------------------------------------------------
 * Editing and deleting
 * Both go through the same /exec endpoint as everything else, but carry the
 * admin key in the POST body — the backend refuses them without it. The key
 * lives only in sessionStorage on this page, never in the deployed HTML.
 * ------------------------------------------------------------------------- */
var EDITING = null;

document.getElementById('list').addEventListener('click', function(e){
  var b = e.target.closest('button[data-act]');
  if(!b) return;
  if(b.dataset.act === 'edit') openEdit(b.dataset.n);
  else doDelete(b.dataset.n);
});

function rowByName(n){
  return ROWS.filter(function(r){ return r.name === n; })[0] || null;
}

function openEdit(encName){
  var name = decodeURIComponent(encName);
  var r = rowByName(name);
  if(!r) return;
  EDITING = r;
  document.getElementById('eName').value = r.name;
  document.getElementById('eAttending').value = r.attending === 'yes' ? 'yes' : 'no';
  document.getElementById('eGuests').value = String(parseInt(r.guests, 10) || 1);
  document.getElementById('eGuestNames').value = r.guestNames || '';
  document.getElementById('eNotComing').value = r.notComing || '';
  document.getElementById('eToast').value = r.toast || '';
  document.getElementById('eErr').textContent = '';
  syncGuestState();
  document.getElementById('editOv').classList.add('show');
}
function closeEdit(){ document.getElementById('editOv').classList.remove('show'); EDITING = null; }

/* Party size is meaningless on a decline — grey it out rather than letting you
   save "not attending, party of 4". */
function syncGuestState(){
  var yes = document.getElementById('eAttending').value === 'yes';
  var g = document.getElementById('eGuests');
  g.disabled = !yes;
  g.style.opacity = yes ? '' : '.45';
}
document.getElementById('eAttending').addEventListener('change', syncGuestState);
document.getElementById('editOv').addEventListener('click', function(e){
  if(e.target === this) closeEdit();
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeEdit(); });

async function adminPost(payload){
  payload.key = KEY;
  var r = await fetch(ENDPOINT, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  var d = await r.json();
  if(d && d.error) throw new Error(d.error);
  return d;
}

async function saveEdit(){
  if(!EDITING) return;
  var btn = document.getElementById('eSave');
  var err = document.getElementById('eErr');
  var name = document.getElementById('eName').value.trim();
  if(!name){ err.textContent = 'A name is required.'; return; }

  var attending = document.getElementById('eAttending').value;
  btn.disabled = true; btn.textContent = 'Saving...'; err.textContent = '';
  try{
    await adminPost({
      type: 'admin-update',
      original: EDITING.name,          // match on the OLD name so renames work
      name: name,
      attending: attending,
      guests: attending === 'yes' ? document.getElementById('eGuests').value : '0',
      guestNames: document.getElementById('eGuestNames').value.trim(),
      notComing:  document.getElementById('eNotComing').value.trim(),
      toast: document.getElementById('eToast').value.trim()
    });
    closeEdit();
    await load();
  }catch(e){
    err.textContent = e.message || 'Could not save that.';
  }finally{
    btn.disabled = false; btn.textContent = 'Save changes';
  }
}

async function doDelete(encName){
  var name = decodeURIComponent(encName);
  var r = rowByName(name);
  var extra = (r && parseInt(r.photos, 10) > 0)
    ? '\n\nTheir ' + r.photos + ' photo(s) will go to the Drive trash too.'
    : '';
  if(!confirm('Delete ' + name + ' from the guest list?' + extra +
     '\n\nThis cannot be undone from here.')) return;
  try{
    var d = await adminPost({ type: 'admin-delete', name: name });
    await load();
    if(d && d.trashedPhotos) console.log('trashed ' + d.trashedPhotos + ' photo(s)');
  }catch(e){
    document.getElementById('err').textContent = e.message || 'Could not delete that.';
  }
}


/* ---------------------------------------------------------------------------
 * Invitations
 * Each person on the list gets a token, and the invitation email links to
 * bobs90th.com/?i=TOKEN. That token is what lets an RSVP be attributed to a
 * specific invitation, which is how "who has not replied yet" is answerable at
 * all. A forwarded link with no token still works, it just shows as a walk-in.
 * ------------------------------------------------------------------------- */
var INVITES = [], SITE = '', INV_FILTER = 'all', TAB = 'replies', NEW_TOKENS = [];

function showTab(t){
  TAB = t;
  document.getElementById('btReplies').classList.toggle('on', t === 'replies');
  document.getElementById('btInvites').classList.toggle('on', t === 'invites');
  document.getElementById('tabReplies').hidden = (t !== 'replies');
  document.getElementById('tabInvites').hidden = (t !== 'invites');
  /* The invites tab exists to answer "who has not replied yet", so it opens on
     that filter rather than on All. */
  if(t === 'invites' && INV_FILTER === 'all'){
    var b = document.querySelector('#invSeg button[data-if="noreply"]');
    if(b) setInvFilter('noreply', b);
  }
}

function tabCounts(){
  document.getElementById('btRN').textContent = ROWS.length || '';
  var waiting = INVITES.filter(function(i){ return !i.replied; }).length;
  document.getElementById('btIN').textContent = waiting || '';
}

function setInvFilter(f, btn){
  INV_FILTER = f;
  document.querySelectorAll('#invSeg button').forEach(function(b){ b.classList.toggle('on', b === btn); });
  renderInvites();
}

/* "No response" is the list that actually gets used — it is who still needs
   chasing, so it counts anyone without a reply whether or not they opened. */
function invVisible(){
  return INVITES.filter(function(i){
    if(NEW_TOKENS.indexOf(i.token) >= 0) return true;
    if(INV_FILTER === 'noreply') return !i.replied;
    if(INV_FILTER === 'opened')  return i.opened && !i.replied;
    if(INV_FILTER === 'unsent')  return !i.sent;
    if(INV_FILTER === 'replied') return !!i.replied;
    return true;
  });
}

function invMsg(text, kind){
  var el = document.getElementById('invMsg');
  el.textContent = text || '';
  el.className = 'inv-msg' + (kind ? ' ' + kind : '');
}

async function addInvites(){
  var raw = document.getElementById('invPaste').value.trim();
  if(!raw){ invMsg('Paste in some names and emails first.', 'err'); return; }

  /* Accept "Name, email", "Name <email>" or "email" alone — people paste all
     three, and rejecting two of them would just be pedantry. */
  var people = [], bad = 0;
  raw.split(/\r?\n/).forEach(function(line){
    line = line.trim();
    if(!line) return;
    /* A trailing ", 4" is a seat count - peel it off before the email
       match, which anchors at the end of the line. */
    var seatTail = line.match(/,\s*(\d{1,2})\s*$/);
    var explicitSeats = 0;
    if(seatTail){ explicitSeats = parseInt(seatTail[1], 10); line = line.slice(0, seatTail.index).trim(); }

    var m = line.match(/^(.*?)[,;<]?\s*([^\s,;<>]+@[^\s,;<>]+\.[^\s,;<>]+)>?$/);
    if(!m){ bad++; return; }
    var email = m[2].trim();
    var whole = m[1].replace(/[,;<]\s*$/, '').trim() || email.split('@')[0];
    /* "Tom Brady & Elaine Brady" is two people on one invitation. Split so we
       store both names and can pre-fill them, rather than treating the pair as
       a single oddly-punctuated guest. */
    var names = whole.split(/\s*(?:&|and|\+)\s*/i)
                     .map(function(x){ return x.trim(); })
                     .filter(Boolean);
    people.push({ name: names.join(', '), seats: explicitSeats || names.length, email: email });
  });
  if(!people.length){ invMsg('Could not read an email address on any line.', 'err'); return; }

  invMsg('Adding ' + people.length + '...');
  try{
    var before = {};
    INVITES.forEach(function(i){ before[i.token] = true; });
    var d = await adminPost({ type:'admin-add-invites', people: people });
    document.getElementById('invPaste').value = '';
    await load();

    /* Make the result impossible to miss: land on the invitation list with the
       new rows highlighted, rather than leaving a cleared text box as the only
       evidence anything happened. */
    NEW_TOKENS = INVITES.filter(function(i){ return !before[i.token]; }).map(function(i){ return i.token; });
    showTab('invites');
    var namesAdded = INVITES.filter(function(i){ return NEW_TOKENS.indexOf(i.token) >= 0; })
                            .map(function(i){ return i.name; });
    invMsg('✓ Added ' + (namesAdded.length ? namesAdded.join('; ') : d.updated + ' updated') +
           ' — now on the list below. Use a Send button when you are ready to email.' +
           (bad ? ' (' + bad + ' line(s) had no email and were skipped.)' : ''), 'ok');
    renderInvites();
    var first = document.querySelector('tr.justadded');
    if(first) first.scrollIntoView({ behavior:'smooth', block:'center' });
    setTimeout(function(){ NEW_TOKENS = []; renderInvites(); }, 6000);
  }catch(e){ invMsg(e.message || 'Could not add those.', 'err'); }
}

async function sendInvites(only){
  var n = INVITES.filter(function(i){
    return only === 'unsent' ? !i.sent : !i.replied;
  }).length;
  if(!n){ invMsg(only === 'unsent' ? 'Everyone has already been emailed.' : 'Everyone has replied.', 'ok'); return; }
  var what = only === 'unsent' ? 'Send the invitation to ' + n + ' person/people?'
                               : 'Send a reminder to ' + n + " who have not replied?";
  if(!confirm(what)) return;

  invMsg('Sending...');
  try{
    var d = await adminPost({ type:'admin-send', only: only });
    var msg = 'Sent ' + d.sent + '.';
    if(d.failed)  msg += ' ' + d.failed + ' failed.';
    /* Consumer Gmail allows roughly 100 a day. Say so plainly rather than
       letting the rest vanish without explanation. */
    if(d.skipped) msg += ' ' + d.skipped + ' skipped (already sent, or the daily limit was reached).';
    msg += ' Quota left today: ' + d.quotaLeft + '.';
    invMsg(msg, 'ok');
    await load();
  }catch(e){ invMsg(e.message || 'Could not send.', 'err'); }
}

async function delInvite(token){
  if(!confirm('Remove this invitation? Their RSVP, if any, is not affected.')) return;
  try{ await adminPost({ type:'admin-del-invite', token: token }); await load(); }
  catch(e){ invMsg(e.message || 'Could not remove it.', 'err'); }
}

function renderInvites(){
  var el = document.getElementById('invList');
  var st = document.getElementById('invStats');
  if(!INVITES.length){
    st.textContent = '';
    el.innerHTML = '<div class="empty">No invitations yet. Add people above, then send.</div>';
    return;
  }
  var sent = INVITES.filter(function(i){ return i.sent; }).length;
  var opened = INVITES.filter(function(i){ return i.opened; }).length;
  var replied = INVITES.filter(function(i){ return i.replied; }).length;
  st.innerHTML = '<b>' + INVITES.length + '</b> invited &middot; <b>' + sent + '</b> emailed &middot; ' +
                 '<b>' + opened + '</b> opened &middot; <b>' + replied + '</b> replied &middot; ' +
                 '<b>' + (INVITES.length - replied) + '</b> outstanding';

  var list = invVisible();
  if(!list.length){
    el.innerHTML = '<div class="empty">Nobody in this group.</div>';
    return;
  }
  el.innerHTML = '<table><thead><tr>' +
      '<th>Invited</th><th style="text-align:center">Seats</th><th>Email</th><th>Status</th><th class="when-h">Emailed</th><th></th>' +
    '</tr></thead><tbody>' +
    list.map(function(i){
      var stage = i.replied ? ['done','Replied'] : i.opened ? ['open','Opened, no reply'] :
                  i.sent ? ['sent','Emailed'] : ['none','Not emailed'];
      return '<tr' + (NEW_TOKENS.indexOf(i.token) >= 0 ? ' class="justadded"' : '') + '>' +
        '<td><div class="nm">' + esc(i.name) + '</div><div class="lnk">' + esc(SITE + '?i=' + i.token) + '</div></td>' +
        '<td class="num">' + esc(i.seats || 1) + '</td>' +
        '<td class="em">' + esc(i.email) + '</td>' +
        '<td><span class="stage ' + stage[0] + '">' + stage[1] + '</span></td>' +
        '<td class="when-col">' + (i.sent ? esc(fmt(i.sent)) : '—') + '</td>' +
        '<td class="acts">' +
          '<button class="mini send" data-send="' + esc(i.token) + '">' + (i.sent ? 'Resend' : 'Send') + '</button>' +
          '<button class="mini del" data-inv="' + esc(i.token) + '">Remove</button></td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
}

document.getElementById('invList').addEventListener('click', function(e){
  var sb = e.target.closest('button[data-send]');
  if(sb){ sendToOne(sb.dataset.send, sb); return; }
  var b = e.target.closest('button[data-inv]');
  if(b) delInvite(b.dataset.inv);
});

/* One person, one email - independent of the bulk buttons. */
async function sendToOne(token, btn){
  var i = INVITES.filter(function(x){ return x.token === token; })[0];
  if(!i) return;
  if(i.sent && !confirm('Send the invitation to ' + i.name + ' again?')) return;
  var t = btn.textContent;
  btn.disabled = true; btn.textContent = 'Sending...';
  try{
    var d = await adminPost({ type:'admin-send-one', token: token });
    invMsg('✓ Invitation sent to ' + i.name + ' (' + (d.to || i.email) + ').', 'ok');
    await load();
  }catch(e){
    invMsg(e.message || 'Could not send.', 'err');
    btn.disabled = false; btn.textContent = t;
  }
}


/* ---------------------------------------------------------------------------
 * CSV import
 * Reads the file in the browser — nothing is uploaded — works out which column
 * holds the email and which holds the name, and drops the result into the box
 * above so it can be eyeballed before anything is saved. A real CSV can quote
 * fields that contain commas ("Brady, Tom"), so this parses properly rather
 * than splitting on commas and hoping.
 * ------------------------------------------------------------------------- */
function parseCsv(text){
  var rows = [], row = [], cell = '', inQuotes = false;
  text = String(text).split(/\r\n|\r/).join("\n");
  for(var i = 0; i < text.length; i++){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ cell += '"'; i++; }   // "" is an escaped quote
        else inQuotes = false;
      } else cell += c;
    } else if(c === '"'){ inQuotes = true; }
    else if(c === ',' || c === ';' || c === '	'){ row.push(cell); cell = ''; }
    else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  row.push(cell);
  if(row.length > 1 || row[0].trim()) rows.push(row);
  return rows.map(function(r){ return r.map(function(x){ return x.trim(); }); })
             .filter(function(r){ return r.some(Boolean); });
}

var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function csvToLines(rows){
  if(!rows.length) return { lines: [], skipped: 0 };

  /* Work out the columns. A header row is one where nothing looks like an
     email — use its labels; otherwise fall back to finding the cell that IS an
     email and treating everything else as the name. */
  var head = rows[0].map(function(h){ return h.toLowerCase(); });
  var hasHeader = !rows[0].some(function(c){ return EMAIL_RE.test(c); });
  var iEmail = -1, iName = -1, iFirst = -1, iLast = -1, iSeats = -1;

  if(hasHeader){
    head.forEach(function(h, i){
      if(iEmail < 0 && /e-?mail/.test(h)) iEmail = i;
      if(iFirst < 0 && /first/.test(h)) iFirst = i;
      if(iLast  < 0 && /last|surname/.test(h)) iLast = i;
      if(iName  < 0 && /^name|full ?name|guest|invite/.test(h)) iName = i;
      if(iSeats < 0 && /seat|guests?|party|count|#/.test(h)) iSeats = i;
    });
    rows = rows.slice(1);
  }

  var lines = [], skipped = 0;
  rows.forEach(function(r){
    var email = iEmail >= 0 ? r[iEmail] : '';
    if(!EMAIL_RE.test(email)){
      email = '';
      for(var i = 0; i < r.length; i++){ if(EMAIL_RE.test(r[i])){ email = r[i]; break; } }
    }
    if(!email){ skipped++; return; }

    var name = '';
    if(iFirst >= 0 || iLast >= 0) name = [r[iFirst] || '', r[iLast] || ''].join(' ').trim();
    else if(iName >= 0) name = r[iName] || '';
    if(!name){
      name = r.filter(function(c){ return c && !EMAIL_RE.test(c) && !/^\d+$/.test(c); }).join(' ').trim();
    }
    if(!name) name = email.split('@')[0];

    var seats = iSeats >= 0 ? parseInt(r[iSeats], 10) : 0;
    lines.push(name + ', ' + email + (seats > 1 ? ', ' + seats : ''));
  });
  return { lines: lines, skipped: skipped };
}

document.getElementById('csvFile').addEventListener('change', function(){
  var f = this.files && this.files[0];
  this.value = '';
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var out = csvToLines(parseCsv(String(reader.result || '')));
      if(!out.lines.length){
        invMsg('No email addresses found in that file.', 'err');
        return;
      }
      var box = document.getElementById('invPaste');
      box.value = (box.value.trim() ? box.value.trim() + '\n' : '') + out.lines.join('\n');
      invMsg('Read ' + out.lines.length + ' from ' + f.name +
             (out.skipped ? ' — ' + out.skipped + ' row(s) had no email' : '') +
             '. Check the list, then Add to list.', 'ok');
    }catch(e){ invMsg('Could not read that file.', 'err'); }
  };
  reader.onerror = function(){ invMsg('Could not read that file.', 'err'); };
  reader.readAsText(f);
});

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
